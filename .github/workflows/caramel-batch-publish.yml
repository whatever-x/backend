name: caramel batch publish

on:
  push:
    paths:
      - 'caramel-batch/**'

concurrency:
  group: batch-build-and-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: setup docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.BATCH_DOCKERHUB_USERNAME }}
          password: ${{ secrets.BATCH_DOCKERHUB_TOKEN }}

      # https://github.com/docker/build-push-action
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./caramel-batch
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/caramel-batch:latest
          platforms: linux/amd64,linux/arm64/v8
