# ┌──────────────────────────── Default / 공통 설정 (Document #1) ────────────────────────────
spring:
  profiles:
    default: dev
    active: local-mem
  application:
    name: caramel-api
  batch:
    job:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_CONNECTION}
      connection-test-query: "SELECT 1"
  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: false
        use_sql_comments: false
        format_sql: true
        globally_quoted_identifiers: true
        order_updates: true
        jdbc:
          batch_size: 20
  cloud:
    openfeign:
      okhttp:
        enabled: true

oauth:
  kakao:
    base-url: ${OAUTH_BASE_URL}
    client-ids: ${OAUTH_CLIENT_IDS}
    client-secret: ${OAUTH_CLIENT_SECRET}
    redirect-url: ${OAUTH_REDIRECT_URL}
    app-id: ${OAUTH_APP_ID}
    admin-key: ${OAUTH_ADMIN_KEY}
  apple:
    base-url: ${APPLE_BASE_URL}
    team-id: ${APPLE_TEAM_ID}
    service-ids: ${APPLE_SERVICE_IDS}
    key-id: ${APPLE_KEY_ID}
    key-path: ${APPLE_KEY_PATH}
    redirect-url: ${APPLE_REDIRECT_URI}

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  swagger-ui:
    path: /swagger
    disable-swagger-default-url: true
    display-request-duration: true

swagger:
  user: ${SWAGGER_USER}
  password: ${SWAGGER_PASSWORD}
  local-server-url: ${LOCAL_SERVER_URL}
  dev-server-url: ${DEV_SERVER_URL}

jwt:
  secret-key-str: ${SECRET_KEY_STR}
  access-expiration-sec: ${ACCESS_EXPIRATION_SEC}
  refresh-expiration-sec: ${REFRESH_EXPIRATION_SEC}
  issuer: Caramel

otel:
  sdk:
    disabled: true
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    exporter: none

management:
  endpoints:
    access:
      default: none
    jmx:
      exposure:
        exclude: '*'
    web:
      base-path: ${ACTUATOR_BASE_PATH}
  server:
    port: ${ACTUATOR_BASE_PORT}
  otlp:
    metrics:
      export:
        enabled: false

kor:
  openapi:
    specialday:
      key: ${OPENAPI_SPECIALDAY_KEY}

firebase:
  credential-file-path: ${GOOGLE_APPLICATION_CREDENTIALS}
  fcm-enabled: ${FCM_ENABLED}

crypto:
  password: ${CRYPTO_PASSWORD}
  salt: ${CRYPTO_SALT}

jasypt:
  encryptor:
    gcm-secret-key-string: ${JASYPT_GCM_SECRET_KEY}

app-store:
  android-uri: https://play.google.com/store/apps/details?id=com.whatever.caramel&hl=ko
  ios-uri: https://apps.apple.com/kr/app/%EC%B9%B4%EB%9D%BC%EB%A9%9C-caramel-%EC%9A%B0%EB%A6%AC%EB%A7%8C%EC%9D%98-%EA%B0%90%EC%84%B1-%EC%BB%A4%ED%94%8C-%EB%8B%A4%EC%9D%B4%EC%96%B4%EB%A6%AC/id6745321351

---
# ┌──────────────────────────── Production 프로파일 ──────────────────────────
spring:
  config:
    activate:
      on-profile: production
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  cache:
    type: redis

management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: 'true'
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE_API}
    access:
      default: read_only

otel:
  sdk:
    disabled: false
  resource:
    attributes:
      deployment.environment: prod
      service.instance.id: ${OTEL_SERVICE_INSTANCE_ID}
  traces:
    exporter: ${OTEL_EXPORTER:otlp}
    sampler: parentbased_traceidratio
    sampler.arg: ${OTEL_TRACES_SAMPLER_ARG:0.5}
  logs:
    exporter: ${OTEL_EXPORTER:otlp}
  exporter:
    otlp:
      protocol: ${OTEL_EXPORTER_PROTOCOL:grpc}
      endpoint: ${OTEL_EXPORTER_ENDPOINT}
      headers:
        tenant_id: caramel-prod
  java:
    disabled:
      resource:
        providers: ${OTEL_DISABLED_PROVIDERS:io.opentelemetry.instrumentation.resources.HostResourceProvider,io.opentelemetry.instrumentation.resources.OsResourceProvider,io.opentelemetry.instrumentation.resources.ProcessResourceProvider,io.opentelemetry.instrumentation.resources.ProcessRuntimeResourceProvider,io.opentelemetry.instrumentation.spring.autoconfigure.internal.resources.DistroVersionResourceProvider}
  metrics:
    exporter: none

springdoc:
  api-docs:
    enabled: false
---
# ┌───────────────────────────── Dev 프로파일 ─────────────────────────────
spring:
  config:
    activate:
      on-profile: dev
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  cache:
    type: redis

management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: 'true'
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE_API}
    access:
      default: read_only

otel:
  sdk:
    disabled: false
  resource:
    attributes:
      deployment.environment: staging
      service.instance.id: ${OTEL_SERVICE_INSTANCE_ID}
  traces:
    exporter: ${OTEL_EXPORTER:otlp}
  logs:
    exporter: ${OTEL_EXPORTER:otlp}
  exporter:
    otlp:
      protocol: ${OTEL_EXPORTER_PROTOCOL:grpc}
      endpoint: ${OTEL_EXPORTER_ENDPOINT}
      headers:
        tenant_id: caramel-staging
  java:
    disabled:
      resource:
        providers: ${OTEL_DISABLED_PROVIDERS:io.opentelemetry.instrumentation.resources.HostResourceProvider,io.opentelemetry.instrumentation.resources.OsResourceProvider,io.opentelemetry.instrumentation.resources.ProcessResourceProvider,io.opentelemetry.instrumentation.resources.ProcessRuntimeResourceProvider,io.opentelemetry.instrumentation.spring.autoconfigure.internal.resources.DistroVersionResourceProvider}
  metrics:
    exporter: none

---
# ┌───────────────────────── Local-mem 프로파일 ────────────────────────────
spring:
  config:
    activate:
      on-profile: local-mem
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  cache: # 원하는 cache의 주석을 해제하여 사용
    type: caffeine
#    type: redis
